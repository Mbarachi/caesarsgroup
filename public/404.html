<!DOCTYPE html>
<html lang="en-NG">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- A 404 must never be indexed, or it competes with the real pages. -->
    <meta name="robots" content="noindex, follow" />
    <title>Page not found | Caesars Energy Services</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center;
        justify-content: center; padding: 24px; background: #f6f7f8;
        color: #2e2e38;
        font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .card {
        max-width: 560px; width: 100%; background: #fff; border-radius: 16px;
        padding: 48px 40px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        text-align: center;
      }
      .code {
        font-size: 13px; font-weight: 700; letter-spacing: .12em;
        text-transform: uppercase; color: #F63D2F;
      }
      h1 { font-size: 28px; margin: 12px 0 12px; line-height: 1.2; }
      p { color: #5b5b66; line-height: 1.6; margin: 0 0 28px; }
      .links { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
      a.btn {
        display: inline-block; padding: 12px 20px; border-radius: 10px;
        text-decoration: none; font-weight: 600; font-size: 15px;
      }
      .primary { background: #2e2e38; color: #fff; }
      .ghost { border: 1px solid #d8d8e0; color: #2e2e38; }
      .foot { margin-top: 28px; font-size: 13px; color: #8a8f99; }
      .foot a { color: #8a8f99; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="code">Error 404</div>
      <h1>We couldn't find that page</h1>
      <p>
        The link may be out of date, or the address mistyped. Everything else is
        still where you left it.
      </p>
      <div class="links">
        <a class="btn primary" href="/">Go to homepage</a>
        <a class="btn ghost" href="/services">Our services</a>
        <a class="btn ghost" href="/savings-calculator">Solar calculator</a>
        <a class="btn ghost" href="/contact">Contact us</a>
      </div>
      <div class="foot">
        Caesars Energy Services · Festac Town, Lagos ·
        <a href="mailto:info@caesarsgroup.ng">info@caesarsgroup.ng</a>
      </div>
    </main>
  </body>
</html>
